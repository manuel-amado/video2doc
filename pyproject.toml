[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video2doc"
version = "0.1.0"
description = "Multimodal video documentation framework converting instructional videos into publication-grade Markdown."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Video2Doc Contributors"}
]
keywords = ["video", "documentation", "llm", "multimodal", "whisper", "ffmpeg", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Documentation",
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "httpx>=0.25.0",
    "openai-whisper>=20231117",
    "faster-whisper>=1.0.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
video2doc = "video2doc.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tier1: Feature coverage E2E tests",
    "tier2: Boundary and corner cases E2E tests",
    "tier3: Cross-feature combinations E2E tests",
    "tier4: Real-world scenario E2E tests",
]
